[application]

# Web `build` & `serve` dist path
out_dir = "dist"

# resource (static) file folder
asset_dir = "assets"

# macOS info.plist override (used for CFBundleDisplayName/Name)
macos_info_plist = "macos/Info.plist"

[web.wasm_opt]
# The level wasm-opt should target. z is the smallest. 4 is the fastest.
level = "4"

[web.app]

# HTML title tag content
title = "M Reader"

[web.watcher]

index_on_404 = true

watch_path = ["src", "examples"]

[bundle]
# Bundle identifier
identifier = "com.chestnutdevstudio.mreader"

# Bundle publisher
publisher = "Chestnut Development Studio"

# Bundle icon
icon = ["assets/icon.icns"]

# Bundle resources
resources = ["assets/*"]

# Bundle copyright
copyright = ""

# Bundle category
category = "Utility"

# Bundle short description
short_description = "A clean, fast markdown reader with live preview."

# Bundle long description
long_description = """
M Reader is a lightweight markdown reader built for focus. Open local files,
browse recent documents, and read with a clean, distraction-free interface.
"""

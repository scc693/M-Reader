name: bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep this version in sync with the dioxus dependency in Cargo.toml
env:
  DIOXUS_CLI_VERSION: "0.7.3"

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm \
            libfuse2 \
            libxdo-dev

      - name: Cache Dioxus CLI
        id: cache-dx
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dx.exe
          key: dx-cli-${{ runner.os }}-${{ env.DIOXUS_CLI_VERSION }}

      - name: Install Dioxus CLI
        if: steps.cache-dx.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version ${{ env.DIOXUS_CLI_VERSION }} --locked

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/bundle_macos.sh

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: dx bundle --desktop --release --package-types deb --package-types rpm --package-types appimage

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        run: dx bundle --desktop --release --package-types msi --package-types nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M-Reader-${{ runner.os }}
          path: dist/**

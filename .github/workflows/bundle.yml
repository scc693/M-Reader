name: bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --locked

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/bundle_macos.sh

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: dx bundle --desktop --release --package-types deb --package-types rpm --package-types appimage

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        run: dx bundle --desktop --release --package-types msi --package-types nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M-Reader-${{ runner.os }}
          path: dist/**
